
services:
  catalog:
    build:
      context: .
      args:
        SERVICE: catalog
    environment:
      DB_PATH: /data/catalog.db
    ports:
      - "127.0.0.1:5101:5001"
    volumes:
      - catalog_data:/data

  frontend:
    build:
      context: .
      args:
        SERVICE: frontend
    environment:
      CATALOG_URL: http://catalog:5001
    ports:
      - "127.0.0.1:5100:5000"
    depends_on:
      - catalog

volumes:
  catalog_data:
