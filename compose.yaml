
services:
  catalog:
    build:
      context: .
      args:
        SERVICE: catalog
    environment:
      DB_PATH: /data/catalog.db
    ports:
      - "127.0.0.1:5101:5001"
    volumes:
      - catalog_data:/data

  order:
    build:
      context: .
      args:
        SERVICE: order
    environment:
      DB_PATH: /data/orders.db
      CATALOG_URL: http://catalog:5001
    ports:
      - "127.0.0.1:5103:5003"
    volumes:
      - order_data:/data
    depends_on:
      - catalog

  frontend:
    build:
      context: .
      args:
        SERVICE: frontend
    environment:
      CATALOG_URL: http://catalog:5001
      ORDER_URL: http://order:5003
    ports:
      - "127.0.0.1:5100:5000"
    depends_on:
      - catalog
      - order

volumes:
  catalog_data:
  order_data:
